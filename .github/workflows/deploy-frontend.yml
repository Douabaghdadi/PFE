name: Déploiement frontend (GitHub Pages)

on:
  push:
    branches: [PFE]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Build Angular (production)
        # Le site est servi sous https://<compte>.github.io/<dépôt>/
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Gérer les routes Angular (rafraîchissement / liens directs)
        # GitHub Pages renvoie 404.html pour une URL inconnue : on y met l'application
        run: cp dist/frontend/browser/index.html dist/frontend/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
