spring.application.name=demo

# ============================================================
# Aucun secret ici : les valeurs sensibles viennent du fichier
# .env en local, et des variables d'environnement en production.
# ============================================================

# Server Configuration (PORT est imposé par l'hébergeur en production)
server.port=${PORT:8081}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/test}
spring.data.mongodb.database=${MONGODB_DATABASE:test}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Email Configuration (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender
app.email.from=noreply@qualinet.com

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.6-flash

# URL du frontend (liens envoyés par email, ex. réinitialisation du mot de passe)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
# Origines autorisées à appeler l'API (CORS), séparées par des virgules
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Vérification des retards (et emails de rappel) au démarrage de l'application.
# Activée en local ; désactivée sur Render (RETARDS_AU_DEMARRAGE=false) où l'application
# redémarre à chaque réveil. Le rappel quotidien de 8h reste actif dans tous les cas.
app.retards.verification-au-demarrage=${RETARDS_AU_DEMARRAGE:true}
