spring.application.name=demo

# ============================================================
# Aucun secret ici : les valeurs sensibles viennent du fichier
# .env en local, et des variables d'environnement en production.
# ============================================================

# Server Configuration (PORT est imposé par l'hébergeur en production)
server.port=${PORT:8081}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/test}
spring.data.mongodb.database=${MONGODB_DATABASE:test}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Emails (réinitialisation du mot de passe, rappels) : envoyés par l'API HTTPS de Brevo.
# L'expéditeur doit être validé dans Brevo (Senders, Domains & Dedicated IPs).
app.email.brevo.api-key=${BREVO_API_KEY:}
app.email.brevo.sender=${BREVO_SENDER_EMAIL:}

# Réunions Google Meet : un seul compte Google organise toutes les réunions, par l'API Google Calendar.
# Sans ces trois valeurs, la planification reste désactivée et le reste de l'application fonctionne.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.refresh-token=${GOOGLE_REFRESH_TOKEN:}

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.6-flash

# URL du frontend (liens et logo des emails, ex. réinitialisation du mot de passe)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
# Origines autorisées à appeler l'API (CORS), séparées par des virgules
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Mot de passe des comptes par défaut (admin, chefprojet, pilote) créés au premier démarrage.
# Vide : aucun compte par défaut n'est créé. Les comptes existants ne sont jamais modifiés.
app.comptes-initiaux.mot-de-passe=${COMPTES_INITIAUX_MOT_DE_PASSE:}

# Jeu de données de démonstration (DemoDataInitializer) : false par défaut,
# true pour le charger s'il est absent, reset pour le supprimer puis le recharger
app.demo-data=${DEMO_DATA:false}

# Pièces jointes : le plafond de 10 Mo par fichier est contrôlé par PieceJointeService, qui donne la raison
# du refus ; ces limites, un peu plus hautes, arrêtent les envois bien plus lourds avant le service
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=12MB
