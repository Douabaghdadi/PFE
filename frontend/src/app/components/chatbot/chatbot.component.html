<!-- Bouton flottant -->
<div style="position: fixed; bottom: 2rem; right: 2rem; z-index: 9999;">

  <!-- Fenêtre du chat -->
  <div *ngIf="isOpen"
       style="position: absolute; bottom: 4.5rem; right: 0; width: 380px; height: 520px;
              background: white; border-radius: 1rem; box-shadow: 0 20px 60px rgba(0,0,0,0.2);
              display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e5e7eb;">

    <!-- Header -->
    <div style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
                padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <div style="width: 2.25rem; height: 2.25rem; background: rgba(255,255,255,0.2);
                    border-radius: 50%; display: flex; align-items: center; justify-content: center;
                    font-size: 1.1rem;">🤖</div>
        <div>
          <p style="color: white; font-weight: 700; margin: 0; font-size: 0.95rem;">Assistant IA</p>
          <p style="color: rgba(255,255,255,0.75); margin: 0; font-size: 0.75rem;">
            {{ context === 'chef_projet' ? 'Chef de Projet' : 'Pilote Qualité' }}
          </p>
        </div>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button (click)="clearChat()"
                title="Nouvelle conversation"
                style="background: rgba(255,255,255,0.15); border: none; color: white;
                       width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer;
                       font-size: 0.85rem; display: flex; align-items: center; justify-content: center;">
          🗑️
        </button>
        <button (click)="toggleChat()"
                style="background: rgba(255,255,255,0.15); border: none; color: white;
                       width: 2rem; height: 2rem; border-radius: 50%; cursor: pointer;
                       font-size: 1rem; display: flex; align-items: center; justify-content: center;">
          ✕
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div #messagesContainer
         style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem;
                background: #f9fafb;">

      <div *ngFor="let msg of messages"
           [style.align-self]="msg.role === 'user' ? 'flex-end' : 'flex-start'"
           style="max-width: 85%;">

        <!-- Message assistant -->
        <div *ngIf="msg.role === 'assistant'"
             style="background: white; border: 1px solid #e5e7eb; border-radius: 0.75rem 0.75rem 0.75rem 0;
                    padding: 0.75rem 1rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
          <p style="margin: 0; font-size: 0.875rem; color: #111827; white-space: pre-wrap; line-height: 1.5;">{{ msg.content }}</p>
          <p style="margin: 0.25rem 0 0; font-size: 0.7rem; color: #9ca3af;">
            {{ msg.timestamp | date:'HH:mm' }}
          </p>
        </div>

        <!-- Message utilisateur -->
        <div *ngIf="msg.role === 'user'"
             style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
                    border-radius: 0.75rem 0.75rem 0 0.75rem; padding: 0.75rem 1rem;
                    box-shadow: 0 2px 8px rgba(99,102,241,0.3);">
          <p style="margin: 0; font-size: 0.875rem; color: white; white-space: pre-wrap; line-height: 1.5;">{{ msg.content }}</p>
          <p style="margin: 0.25rem 0 0; font-size: 0.7rem; color: rgba(255,255,255,0.65);">
            {{ msg.timestamp | date:'HH:mm' }}
          </p>
        </div>
      </div>

      <!-- Indicateur de chargement -->
      <div *ngIf="isLoading" style="align-self: flex-start; max-width: 85%;">
        <div style="background: white; border: 1px solid #e5e7eb; border-radius: 0.75rem 0.75rem 0.75rem 0;
                    padding: 0.75rem 1rem; display: flex; gap: 0.3rem; align-items: center;">
          <span style="width: 8px; height: 8px; background: #6366f1; border-radius: 50%;
                       animation: bounce 1s infinite;"></span>
          <span style="width: 8px; height: 8px; background: #6366f1; border-radius: 50%;
                       animation: bounce 1s infinite 0.2s;"></span>
          <span style="width: 8px; height: 8px; background: #6366f1; border-radius: 50%;
                       animation: bounce 1s infinite 0.4s;"></span>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div style="padding: 0.75rem 1rem; border-top: 1px solid #e5e7eb; background: white;
                display: flex; gap: 0.5rem; align-items: flex-end;">
      <textarea [(ngModel)]="userInput"
                (keydown)="onKeyDown($event)"
                placeholder="Posez votre question... (Entrée pour envoyer)"
                rows="1"
                [disabled]="isLoading"
                style="flex: 1; border: 2px solid #e5e7eb; border-radius: 0.5rem; padding: 0.6rem 0.75rem;
                       font-size: 0.875rem; resize: none; outline: none; font-family: inherit;
                       transition: border-color 0.2s;"
                onfocus="this.style.borderColor='#6366f1'"
                onblur="this.style.borderColor='#e5e7eb'">
      </textarea>
      <button (click)="sendMessage()"
              [disabled]="!userInput.trim() || isLoading"
              style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
                     border: none; color: white; width: 2.5rem; height: 2.5rem; border-radius: 0.5rem;
                     cursor: pointer; font-size: 1.1rem; display: flex; align-items: center;
                     justify-content: center; flex-shrink: 0; transition: opacity 0.2s;"
              [style.opacity]="!userInput.trim() || isLoading ? '0.5' : '1'">
        ➤
      </button>
    </div>
  </div>

  <!-- Bouton toggle -->
  <button (click)="toggleChat()"
          style="width: 3.5rem; height: 3.5rem; border-radius: 50%; border: none; cursor: pointer;
                 background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
                 box-shadow: 0 4px 20px rgba(99,102,241,0.5); font-size: 1.5rem;
                 display: flex; align-items: center; justify-content: center;
                 transition: transform 0.2s;"
          onmouseover="this.style.transform='scale(1.1)'"
          onmouseout="this.style.transform='scale(1)'">
    {{ isOpen ? '✕' : '🤖' }}
  </button>
</div>

<style>
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }
</style>
