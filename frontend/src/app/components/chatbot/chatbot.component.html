<!-- Bouton flottant -->
<div class="chat-root">

  <!-- Fenêtre du chat -->
  <div *ngIf="isOpen" class="chat-window">

    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-avatar">🤖</div>
        <div>
          <p class="chat-title">Assistant IA</p>
          <p class="chat-subtitle">
            <span class="chat-status-dot"></span>
            {{ context === 'chef_projet' ? 'Chef de Projet' : 'Pilote Qualité' }}
          </p>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="chat-icon-btn" (click)="clearChat()" title="Nouvelle conversation">🗑️</button>
        <button class="chat-icon-btn" (click)="toggleChat()" title="Fermer">✕</button>
      </div>
    </div>

    <!-- Messages -->
    <div #messagesContainer class="chat-messages">

      <div *ngFor="let msg of messages" class="chat-row" [class.assistant]="msg.role === 'assistant'" [class.user]="msg.role === 'user'">

        <div *ngIf="msg.role === 'assistant'" class="chat-bubble-avatar">🤖</div>

        <div class="chat-bubble" [class.assistant]="msg.role === 'assistant'" [class.user]="msg.role === 'user'">
          <div *ngIf="msg.role === 'assistant'" class="chat-bubble-text chat-bubble-rich" [innerHTML]="msg.content | chatMarkdown"></div>
          <p *ngIf="msg.role === 'user'" class="chat-bubble-text">{{ msg.content }}</p>
          <p class="chat-bubble-time">{{ msg.timestamp | date:'HH:mm' }}</p>
        </div>
      </div>

      <!-- Questions suggérées -->
      <div *ngIf="messages.length === 1 && !isLoading" class="chat-suggestions">
        <button *ngFor="let question of suggestedQuestions"
                class="chat-suggestion-chip"
                (click)="askSuggestion(question)">
          {{ question }}
        </button>
      </div>

      <!-- Indicateur de chargement -->
      <div *ngIf="isLoading" class="chat-typing">
        <div class="chat-bubble-avatar">🤖</div>
        <div class="chat-typing-bubble">
          <span class="chat-typing-dot"></span>
          <span class="chat-typing-dot"></span>
          <span class="chat-typing-dot"></span>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-bar">
      <textarea class="chat-textarea"
                [(ngModel)]="userInput"
                (keydown)="onKeyDown($event)"
                placeholder="Posez votre question... (Entrée pour envoyer)"
                rows="1"
                [disabled]="isLoading">
      </textarea>
      <button class="chat-send-btn" (click)="sendMessage()" [disabled]="!userInput.trim() || isLoading">
        ➤
      </button>
    </div>
  </div>

  <!-- Bouton toggle -->
  <button class="chat-fab" (click)="toggleChat()">
    {{ isOpen ? '✕' : '🤖' }}
  </button>
</div>
