<main class="page">
  <div class="page-container is-detail">

    <!-- ============ Chargement ============ -->
    @if (loading) {
      <div aria-busy="true">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-meta"></div>
        <div class="skeleton skeleton-strip"></div>
        <div class="skeleton skeleton-panel"></div>
        <div class="skeleton skeleton-panel"></div>
      </div>
    }

    <!-- ============ Erreur ============ -->
    @if (error && !loading) {
      <div class="error-banner" role="alert">
        <span>{{ error }}</span>
        <button type="button" class="btn btn-secondary" (click)="goBack()">Retour aux fiches de suivi</button>
      </div>
    }

    <!-- ============ Fiche ============ -->
    @if (ficheSuivi; as f) {
      @if (!loading && !error) {
        <header class="page-header">
          <div>
            <h1 class="page-title">{{ f.numeroRapport || 'Sans numéro' }}</h1>
            <p class="meta-line">
              @if (f.dateRapport) {
                <span class="meta-text">Rapport du {{ formatDate(f.dateRapport) }}</span>
              }
              @if (projetNom) {
                <span class="meta-text">Projet : <a class="meta-link" [routerLink]="['/pilote-qualite/fiches-projet', f.ficheProjetId]">{{ projetNom }}</a></span>
              }
            </p>
          </div>

          <div class="page-actions">
            <button type="button" class="btn btn-secondary" (click)="goBack()">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18"/>
              </svg>
              Retour aux fiches de suivi
            </button>
          </div>
        </header>

        <app-fiche-validation type="fiches-suivi" [ficheId]="f.id!" [validation]="f.validation"
                              [peutDecider]="peutDecider" (decidee)="f.validation = $event" />

        <app-pieces-jointes type="fiches-suivi" [ficheId]="f.id!" />

        <app-fiche-suivi-corps [fiche]="f" [ganttLink]="['/pilote-qualite/fiches-suivi', f.id, 'gantt']" />
      }
    }
  </div>
</main>
