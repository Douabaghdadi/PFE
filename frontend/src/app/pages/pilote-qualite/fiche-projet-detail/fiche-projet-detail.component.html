<main class="page">
  <div class="page-container is-detail">

    <!-- ============ Chargement ============ -->
    @if (loading) {
      <div aria-busy="true">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-meta"></div>
        <div class="skeleton skeleton-strip"></div>
        <div class="skeleton skeleton-panel"></div>
        <div class="skeleton skeleton-panel"></div>
      </div>
    }

    <!-- ============ Erreur ============ -->
    @if (error && !loading) {
      <div class="error-banner" role="alert">
        <span>{{ error }}</span>
        <button type="button" class="btn btn-secondary" (click)="goBack()">Retour à la liste</button>
      </div>
    }

    <!-- ============ Fiche ============ -->
    @if (ficheProjet; as p) {
      @if (!loading) {
        <header class="page-header">
          <div>
            <h1 class="page-title">{{ p.nomProjet || p.designationProjet }}</h1>
            <p class="meta-line">
              <span class="pill" [ngClass]="'pill-' + statutKey(p.statut)">{{ statutDef(p.statut).label }}</span>
              @if (p.designationClient) {
                <span class="meta-text"><span class="visually-hidden">Client : </span>{{ p.designationClient }}</span>
              }
              @if (p.reference) {
                <span class="meta-text"><span class="visually-hidden">Référence : </span>{{ p.reference }}</span>
              }
            </p>
          </div>

          <div class="page-actions">
            <button type="button" class="btn btn-secondary" (click)="goBack()">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18"/>
              </svg>
              Retour
            </button>
            <button type="button" class="btn btn-primary" (click)="viewHistorique()">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              Historique complet
            </button>
          </div>
        </header>

        <app-projet-fiche [projet]="p" />
      }
    }
  </div>
</main>
