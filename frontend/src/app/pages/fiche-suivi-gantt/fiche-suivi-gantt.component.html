<main class="page">
  <div class="page-container">

    <!-- ============ Chargement ============ -->
    @if (loading) {
      <div aria-busy="true">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-meta"></div>
        <div class="skeleton skeleton-panel"></div>
      </div>
    }

    <!-- ============ Erreur ============ -->
    @if (error && !loading) {
      <div class="error-banner" role="alert">
        <span>{{ error }}</span>
        <button type="button" class="btn btn-secondary" (click)="goBack()">Retour à la fiche de suivi</button>
      </div>
    }

    <!-- ============ Diagramme ============ -->
    @if (ficheSuivi; as f) {
      @if (!loading && !error) {
        <header class="page-header">
          <div>
            <h1 class="page-title">Diagramme de Gantt</h1>
            <p class="meta-line">
              <span class="meta-text">{{ f.numeroRapport || 'Sans numéro' }}</span>
              @if (projetNom) {
                <span class="meta-text">Projet : <a class="meta-link" [routerLink]="['/projets', f.ficheProjetId]">{{ projetNom }}</a></span>
              }
            </p>
          </div>

          <div class="page-actions">
            <button type="button" class="btn btn-secondary" (click)="goBack()">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18"/>
              </svg>
              Retour à la fiche de suivi
            </button>
          </div>
        </header>

        <app-fiche-suivi-gantt-chart [taches]="f.tachesSuivi || []" />
      }
    }
  </div>
</main>
